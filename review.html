<style>
/* ══ DP CLIENT-PAGE BASE STYLES — identical in every client page. Colours
   below are only the fallback; the FIRM SETTINGS block overrides them per firm. ══ */
:root{
  --bg:#1B1512; --s1:#2A211D; --s2:#332924; --s3:#3C312B; --border:#3A2F2A; --border2:#4F4038;
  --accent:#F2E8DE; --accent2:rgba(242,232,222,.10); --on-accent:#1B1512;
  --coral:#E8734A; --coraldim:rgba(232,115,74,.15);
  --text:#F2E8DE; --t2:#A99A8F; --t3:#786A60;
  --green:#4C9A6A; --gdim:rgba(76,154,106,.14); --blue:#4A8FC7; --orange:#C08A3E; --red:#C1553D; --rdim:rgba(193,85,61,.15);
  --r:20px; --r2:8px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --page-w:460px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--coral)}
.wrap{max-width:var(--page-w);margin:0 auto;padding:0 0 40px}
.hdr{padding:calc(22px + env(safe-area-inset-top,0px)) 18px 16px;text-align:center;border-bottom:1px solid var(--border)}
.hdr .logo{font-size:34px;line-height:1;margin-bottom:8px;min-height:40px;display:flex;align-items:center;justify-content:center}
.hdr .logo img{width:40px;height:40px;border-radius:11px;object-fit:cover;display:block}
.hdr h1{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.2px;margin:0 0 4px;min-height:1.2em}
.hdr p{font-size:11px;color:var(--t3);margin:0}
.state{padding:60px 24px;text-align:center}
.state .ico{font-size:40px;margin-bottom:14px}
.state h2{font-size:15px;font-weight:800;margin:0 0 8px}
.state p{font-size:12px;color:var(--t2);line-height:1.6;margin:0}
.greet{padding:18px;text-align:center}
.greet .name{font-size:17px;font-weight:800}
.greet .sub{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.55}
.fi{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:11px 12px;color:var(--text);font-family:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.fi:focus{border-color:var(--accent)}
.savebtn{display:block;width:calc(100% - 28px);margin:4px 14px 0;padding:13px;font-family:inherit;font-size:14px;font-weight:700;color:var(--on-accent);background:var(--accent);border:none;border-radius:var(--r2);cursor:pointer}
.savebtn:disabled{opacity:.5;cursor:default}
.savemsg{font-size:12px;margin:10px 14px 0;text-align:center;line-height:1.5;min-height:1px}
.savemsg.ok{color:var(--green)}
.savemsg.err{color:var(--red)}
.footer-note{padding:18px 24px 4px;text-align:center;font-size:11px;color:var(--t3);line-height:1.6}
.footer-note a{color:var(--t2)}
.consent-box{margin:0 14px 16px;background:var(--s1);border:1px solid var(--accent);border-radius:var(--r);padding:16px}
.consent-box .t{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px;line-height:1.4}
.consent-box p{font-size:12px;color:var(--t2);line-height:1.7;margin:0 0 12px}
.consent-check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;-webkit-user-select:none;user-select:none}
.consent-check input[type=checkbox]{width:20px;height:20px;min-width:20px;margin-top:1px;accent-color:var(--coral);cursor:pointer}
.consent-check span{font-size:13px;font-weight:700;color:var(--text);line-height:1.4}
.gated{opacity:.4;pointer-events:none;transition:opacity .2s}
.gated.open{opacity:1;pointer-events:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--t3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:4px}
.spin.lg{width:22px;height:22px}
@keyframes sp{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
@media (min-width:700px){
  .hdr{padding:30px 18px 20px}
  .hdr .logo{font-size:42px;min-height:50px}
  .hdr .logo img{width:50px;height:50px;border-radius:13px}
  .hdr h1{font-size:22px}
  .state{padding:90px 24px}
}
body{line-height:1.7}
.wrap{padding-bottom:50px}
.letter{margin:20px 16px;background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:22px 20px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.letter .body{font-size:15px;color:var(--text);white-space:pre-wrap;line-height:1.85;overflow-wrap:anywhere}
.meta{padding:0 20px;font-size:11px;color:var(--t3);text-align:center;margin:-6px 0 6px}
.actions{display:flex;gap:8px;padding:4px 16px 0}
.actbtn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--s1);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.actbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (min-width:700px){
  :root{ --page-w:640px; }
  .letter{padding:32px 36px}
  .letter .body{font-size:16px}
}
@media print{ .actions,.hdr p{display:none} body{background:#fff;color:#000} .letter{border:none;box-shadow:none;background:#fff} .letter .body{color:#000} }
</style>

(function(){

  };
  var C=window.DP_CONFIG||{};

  try{ if(!C.scriptUrl && typeof SCRIPT_URL==='string') C.scriptUrl=SCRIPT_URL; }catch(e){}
  var D={};
  Object.keys(DEF).forEach(function(k){
    var d=DEF[k], c=C[k];
    if(d && typeof d==='object' && !Array.isArray(d)){ var o={}; Object.keys(d).forEach(function(x){ o[x]=d[x]; }); if(c && typeof c==='object') Object.keys(c).forEach(function(x){ if(c[x]!==undefined && c[x]!==null) o[x]=c[x]; }); D[k]=o; }
    else D[k]=(c!==undefined && c!==null && !(Array.isArray(d) && !(Array.isArray(c) && c.length))) ? c : d;
  });
  D.scriptUrl=String(D.scriptUrl||'').trim();
  D.connected=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(D.scriptUrl);
  D.legal=D.firm.legalName||D.firm.brandName||'';
  D.brand=D.firm.brandName||D.firm.legalName||'';
  window.DP=D;

  // ── Theme → CSS variables (before first paint; this script runs in <head>) ──
  var rs=document.documentElement.style, t=D.theme||{};
  function hex(h){ return /^#[0-9a-f]{6}$/i.test(String(h||'')); }
  function rgb(h){ var n=parseInt(String(h).slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function rgba(h,a){ var c=rgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
  function lum(h){ var c=rgb(h).map(function(v){ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }
  Object.keys(t).forEach(function(k){ if(hex(t[k])) rs.setProperty('--'+k, t[k]); });
  if(hex(t.accent)) rs.setProperty('--accent2', rgba(t.accent,.10));
  if(hex(t.coral)) rs.setProperty('--coraldim', rgba(t.coral,.15));
  if(hex(t.green)) rs.setProperty('--gdim', rgba(t.green,.14));
  if(hex(t.red)) rs.setProperty('--rdim', rgba(t.red,.15));
  var acc=hex(t.accent)?t.accent:'#F2E8DE', bg=hex(t.bg)?t.bg:'#1B1512';

  rs.setProperty('--on-accent', lum(acc)>.45 ? (lum(bg)<.2 ? bg : '#111111') : '#FFFFFF');

// ── Helpers shared by every client page ──
function qs(name){ return new URLSearchParams(window.location.search).get(name)||''; }
// Escapes for BOTH text and attribute context (quotes included).
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function skey(n){ return DP.storagePrefix+n; }
function cacheGet(key, maxAgeMs, withMeta){
  try{
    var r=JSON.parse(localStorage.getItem(skey(key))||'null');
    if(!r || !r.savedAt) return null;
    if(maxAgeMs && Date.now()-r.savedAt>maxAgeMs){ localStorage.removeItem(skey(key)); return null; }
    return withMeta ? r : r.v;
  }catch(e){ return null; }
}
function cacheSet(key, v){ try{ localStorage.setItem(skey(key), JSON.stringify({savedAt:Date.now(), v:v})); }catch(e){} }
function cacheDel(key){ try{ localStorage.removeItem(skey(key)); }catch(e){} }
var DAY_MS=24*60*60*1000;

var NOT_CONNECTED='This page isn\u2019t connected yet. Please let your advisor know.';
// POST with text/plain (no CORS preflight), same pattern as crm.html.
async function apiPost(data, timeoutMs){
  if(!DP.connected) return {success:false, error:NOT_CONNECTED};
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null, timer=null;
  if(ctl) timer=setTimeout(function(){ ctl.abort(); }, timeoutMs||30000);
  try{
    var r=await fetch(DP.scriptUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data), signal:ctl?ctl.signal:undefined});
    if(timer) clearTimeout(timer);
    var txt=await r.text();
    var j; try{ j=JSON.parse(txt); }catch(e){ return {success:false, error:'The server sent an unexpected reply (HTTP '+r.status+'). Please try again.'}; }
    // A client page must never tell a client their "session expired" — that
    // reply means the action is not on the server's public list yet.
    if(j && j.error==='SESSION_EXPIRED') return {success:false, code:'NOT_PUBLIC', error:'This isn\u2019t switched on at your advisor\u2019s end yet. Please let your advisor know.'};
    return j;
  }catch(e){
    if(timer) clearTimeout(timer);
    if(e && e.name==='AbortError') return {success:false, error:'The server took too long to respond. Please try again.'};
    return {success:false, error:'Could not reach the server \u2014 check your internet connection.'};
  }
}
// GET with one automatic retry — Apps Script is often slow on the first
// request after a quiet spell (cold start).
async function apiGet(params, attempts, timeoutMs){
  if(!DP.connected) throw new Error(NOT_CONNECTED);
  var q=new URLSearchParams(params); q.set('t', Date.now());
  var url=DP.scriptUrl+'?'+q.toString(), last;
  for(var i=0;i<(attempts||2);i++){
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=ctl?setTimeout(function(){ ctl.abort(); }, timeoutMs||15000):null;
    try{
      var r=await fetch(url, {signal:ctl?ctl.signal:undefined});
      if(timer) clearTimeout(timer);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){
      if(timer) clearTimeout(timer);
      last=(e && e.name==='AbortError')?new Error('Request timed out'):e;
      if(i<(attempts||2)-1) await new Promise(function(res){ setTimeout(res, 800); });
    }
  }
  throw last;
}

function renderError(title, msg, icon){
  var app=document.getElementById('app');
  if(app) app.innerHTML='<div class="state"><div class="ico">'+(icon||'\u26A0\uFE0F')+'</div><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div>';
}
// Common guards: connection + whether this firm has the page switched on.
function pageGuard(featureKey){
  if(!DP.connected){ renderError('Not connected yet', NOT_CONNECTED, '\uD83D\uDD0C'); return false; }
  if(featureKey && DP.features[featureKey]===false){ renderError('Page not available', 'This page isn\u2019t part of your advisor\u2019s service. Please contact them directly.', '\uD83D\uDEAB'); return false; }
  return true;
}

// ── Branding — firm name + logo from the FIRM SETTINGS block. The runtime
// lookup (getFirmBranding) only runs when that block has no firm details,
// so a normal page view costs zero extra server calls for branding. ──
var _pageTitle=document.title;
function applyBrand(name, logo, emoji){
  var h=document.getElementById('hdr-firmname'); if(h) h.textContent=name||'Your advisor';
  var l=document.getElementById('hdr-logo');
  if(l){
    l.textContent='';
    if(logo && /^(data:image\/|https:\/\/)/i.test(logo)){ var im=document.createElement('img'); im.alt=''; im.src=logo; l.appendChild(im); }
    else l.textContent=emoji||'';
  }
  document.title=_pageTitle+(name?' \u2014 '+name:'');
}
function mountBrand(emoji){
  applyBrand(DP.legal, DP.logo, emoji);
  if(DP.legal && DP.logo) return;
  var c=cacheGet('firm_branding');
  if(c) applyBrand(c.firmName||DP.legal, c.logoDataUrl||DP.logo, emoji);
  apiPost({action:'getFirmBranding'}, 15000).then(function(res){
    if(res && res.success && (res.firmName||res.logoDataUrl)){
      applyBrand(res.firmName||DP.legal, res.logoDataUrl||DP.logo, emoji);
      if(res.firmName && !DP.legal){ DP.legal=res.firmName; DP.brand=DP.brand||res.firmName; }
      cacheSet('firm_branding', {firmName:res.firmName||'', logoDataUrl:res.logoDataUrl||''});
    }
  });
}
function firmFooter(extra){
  return '<div class="footer-note">'+(DP.legal?esc(DP.legal)+'<br>':'')+(extra?esc(extra)+'<br>':'')
    +'<a href="privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a></div>';
}

// ── DPDP consent — one reusable block. The exact wording shown is the exact
// wording logged (by token, server-side) to the firm's DPDP Consents tab.
// Remembered on this device per link + wording, so a returning client
// isn't asked again and no duplicate consent rows are written; a change in
// wording asks again. ──
function _hash(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function consentHtml(text){
  return '<div class="consent-box">'
    + '<div class="t">Before we begin, please confirm below.</div>'
    + '<p>'+esc(text)+' See the <a href="privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>'
    + '<label class="consent-check"><input type="checkbox" id="consentCheckbox"><span>I have read and agree to the above</span></label>'
    + '<div class="savemsg" id="consentMsg" role="status"></div>'
    + '</div>';
}
function wireConsent(token, page, text, onChange){
  var cb=document.getElementById('consentCheckbox'), msg=document.getElementById('consentMsg');
  var key='consent_'+page+'_'+token+'_'+_hash(text);
  if(cacheGet(key)){ cb.checked=true; onChange(true); }
  cb.onchange=async function(){
    if(!cb.checked){ onChange(false); msg.textContent=''; msg.className='savemsg'; return; }
    cb.disabled=true; msg.textContent='Saving your consent\u2026'; msg.className='savemsg';
    var res=await apiPost({action:'logDpdpConsent', token:token, page:page, consentText:text}, 20000);
    cb.disabled=false;
    if(res && res.success){
      cacheSet(key, 1); onChange(true);
      msg.textContent='\u2705 Thank you \u2014 please go ahead below.'; msg.className='savemsg ok';
    } else {
      cb.checked=false; onChange(false);
      msg.textContent='Could not save your consent: '+((res&&res.error)||'please try again.'); msg.className='savemsg err';
    }
  };
}
</script>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo" id="hdr-logo" aria-hidden="true"></div>
    <h1 id="hdr-firmname"></h1>
    <p>Your portfolio review</p>
  </div>
  <main id="app">
    <div class="state"><div class="spin lg"></div></div>
  </main>
</div>

<script>
var shown=null; // the report currently on screen

function renderLetter(report, generatedDate){
  shown=report;
  var dateLabel=generatedDate ? String(generatedDate).split(' ')[0] : '';
  document.getElementById('app').innerHTML=
      '<article class="letter"><div class="body" id="letterBody">'+esc(report)+'</div></article>'
    + (dateLabel?'<div class="meta">Prepared on '+esc(dateLabel)+'</div>':'')
    + '<div class="actions">'
    +   '<button type="button" class="actbtn" id="btnCopy">📋 Copy</button>'
    +   '<button type="button" class="actbtn primary" id="btnShare">📤 Share</button>'
    + '</div>'
    + '<div class="footer-note">🔒 This review was prepared just for you. Questions? Reach out to your advisor anytime.</div>'
    + firmFooter();

  function flash(id, t){ var b=document.getElementById(id), o=b.textContent; b.textContent=t; setTimeout(function(){ b.textContent=o; }, 1500); }
  function copy(id, okText){
    var text=document.getElementById('letterBody').textContent;
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ flash(id, okText); }, function(){ flash(id,'Copy failed'); });
    else flash(id,'Copy not supported');
  }
  document.getElementById('btnCopy').onclick=function(){ copy('btnCopy','✅ Copied'); };
  document.getElementById('btnShare').onclick=function(){
    var text=document.getElementById('letterBody').textContent;
    if(navigator.share) navigator.share({title:'My Portfolio Review'+(DP.brand?' \u2014 '+DP.brand:''), text:text}).catch(function(){});
    else copy('btnShare','✅ Copied instead');
  };
}

function cacheKey(t){ return 'review_'+t; }

async function init(){
  mountBrand('💌');
  if(!pageGuard('reviewreport')) return;
  var token=qs('id');
  if(!token){ renderError('Invalid link','This link is missing information. Please contact your advisor for a new one.'); return; }

  var cached=cacheGet(cacheKey(token), DAY_MS);
  if(cached) renderLetter(cached.report, cached.generatedDate);

  var res=await apiPost({action:'getClientReviewReport', token:token}, 20000);
  if(res && res.success){
    cacheSet(cacheKey(token), {report:res.report, generatedDate:res.generatedDate});
    // Re-render when the advisor has regenerated the report since it was cached.
    if(res.report!==shown) renderLetter(res.report, res.generatedDate);
  } else if(!cached){
    renderError('Not ready yet', (res && res.error) || 'This review isn\u2019t available yet. Please check back shortly or contact your advisor.', '⏳');
  } else if(res && res.success===false && res.error && !/reach the server|too long|unexpected reply/i.test(res.error)){
    // The server explicitly says this report/link no longer resolves —
    // don't keep showing a stale copy from this device.
    cacheDel(cacheKey(token));
    renderError('Not available', res.error);
  }
}

init();
</script>
</body>
</html>
